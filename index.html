    <div class="hero-text">
      <p class="hero-eyebrow">千年の星命術</p>
      <h1 class="hero-title">あなたの命盤を<br>読み解く</h1>
      <p class="hero-sub">生年月日と時刻から、紫微斗数の命盤を生成します。<br>星の配置があなたの本質と運命を映し出します。</p>
      <a href="#form" class="btn-primary">命盤を作成する</a>

  <!-- 命盤フォーム -->
  <section class="form-section" id="form">
    <div class="container">
      <h2 class="section-title">命盤を作成する</h2>
      <p class="section-sub">生年月日と出生時刻を入力してください</p>
      <div class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">生年月日</label>
            <input type="date" class="form-input" id="birthdate">
          </div>
          <div class="form-group">
            <label class="form-label">出生時刻</label>
            <select class="form-input" id="birthtime">
              <option value="">選択してください</option>
              <option value="0">子の刻（23:00〜01:00）</option>
              <option value="1">丑の刻（01:00〜03:00）</option>
              <option value="2">寅の刻（03:00〜05:00）</option>
              <option value="3">卯の刻（05:00〜07:00）</option>
              <option value="4">辰の刻（07:00〜09:00）</option>
              <option value="5">巳の刻（09:00〜11:00）</option>
              <option value="6">午の刻（11:00〜13:00）</option>
              <option value="7">未の刻（13:00〜15:00）</option>
              <option value="8">申の刻（15:00〜17:00）</option>
              <option value="9">酉の刻（17:00〜19:00）</option>
              <option value="10">戌の刻（19:00〜21:00）</option>
              <option value="11">亥の刻（21:00〜23:00）</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">出生地域</label>
              <select class="form-input" id="birthplace">
                <option value="">選択してください</option>
              </select>
              <label class="form-label">出生時刻</label>
                <input
                type="time"
                class="form-input"
                id="birthTime"
              >
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">性別</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="gender" value="male"> 男性</label>
              <label class="radio-label"><input type="radio" name="gender" value="female"> 女性</label>
            </div>
          </div>
        </div>
        <button class="btn-primary btn-full" id="generateBtn">命盤を生成する</button>

        <!-- 結果エリア -->
        <div class="result" id="result" style="display:none;">
          <div class="result-divider">✦ 命盤結果 ✦</div>
          <div class="result-grid" id="resultGrid"></div>
          <div class="calculation-result">
            <p id="calculationresult"></p>
          </div>
        </div>
      </div>
    </div>
  </section>
